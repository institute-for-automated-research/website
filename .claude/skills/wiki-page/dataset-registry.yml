# Controlled vocabulary for the DATASETS a distilled paper draws on.
# Single source of truth for what each `data:<slug>` tag MEANS and, crucially,
# its ACCESS TIER. Access is a property of the DATASET, not of the paper: the
# FR Y-14Q is confidential supervisory data no matter who uses it, NielsenIQ is
# licensed-commercial no matter who licenses it. Normalize the tier once here so
# that a paper's `paper.dataAccess` can be DERIVED as the most-restrictive tier
# over the paper's `data:<slug>` tags, rather than hand-set per page.
#
# Usage stats (which papers cite a dataset, first-seen year) are DERIVED at build
# from the pages, never stored here, so parallel distillers never collide on this
# file. Mirrors the discipline in vocab-registry.yml.
#
# Discipline:
# - A paper-distiller READS this file and reuses an existing `data:<slug>` before
#   minting a new one. It NEVER writes here; a genuinely new dataset is staged on
#   the page in `paper.proposedVocab` (kind: data) for the curator to reconcile.
# - The `<slug>` MUST equal the dataset/licensed page filename when a page exists,
#   so the `page:` pointer and TagIndex's `data:<slug>` link agree.
# - `page:` is the collection-relative path to the wiki page, or absent when the
#   dataset is cited but not yet documented (the build backlog). The filesystem is
#   the canonical check; this pointer is a convenience and the build may verify it.
#
# access tier enum (matches content.config.ts paper.dataAccess; ordered least to
# most restrictive for the DERIVE max):
#   public                  -> free, openly downloadable, no credentials
#   licensed-commercial     -> obtainable by anyone who pays a vendor / holds a
#                              site or research licence (incl. WRDS-gated feeds)
#   proprietary-confidential-> restricted: supervisory, administrative-registry,
#                              individual-level, or a single private counterparty;
#                              not purchasable off the shelf
# ('hand-collected' is a paper-level tier only and never appears on a dataset.)

