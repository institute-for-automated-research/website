    name: FR 2420 Report of Selected Money Market Rates
    provider: Federal Reserve (confidential)
    access: proprietary-confidential
    note: Confidential transaction-level fed funds, Eurodollar, and CD rates collected from banks and FBOs.
  fr2644:
    name: FR 2644 Weekly Report of Selected Assets and Liabilities
    provider: Federal Reserve (confidential)
    access: proprietary-confidential
    note: Confidential weekly bank balance-sheet data for domestic banks and FBO branches.
  banorte-experiment:
    name: Banorte bank-account panel and savings field experiment (Mexico)
    provider: Banorte (confidential)
    access: proprietary-confidential
    note: >-
      Individual-level checking, credit-card, and transaction records for
      millions of customers from a single bank, plus a randomized savings
      experiment; confidential single-counterparty data.
  bank-of-italy-credit-register:
    name: Italian Credit Register (Centrale dei Rischi)
    provider: Bank of Italy (confidential)
    access: proprietary-confidential
    note: >-
      Firm-bank loan quantities and interest rates above a reporting
      threshold; confidential supervisory access through the central bank.
      The Or.So. bank-board register and supervisory balance-sheet reports
      are restricted Bank of Italy sources accessed under the same terms.
  lisa-sweden:
    name: LISA longitudinal register (Statistics Sweden)
    provider: Statistics Sweden (SCB)
    access: proprietary-confidential
    note: >-
      Individual-level annual labor-market, income, transfer, education, and
      wealth records for all Swedish residents; restricted administrative
      microdata. The Wealth Register is accessed under the same terms.
  fek-sweden:
    name: Structural Business Statistics (FEK, Statistics Sweden)
    provider: Statistics Sweden (SCB)
    access: proprietary-confidential
    note: Firm-level employment, payroll, productivity, and balance-sheet microdata; restricted administrative access.

  # ---- JF 80(3) batch ----
  barro-ursua:
    page: datasets/barro-ursua
    name: Barro-Ursua Macroeconomic Database
    provider: Robert Barro and Jose Ursua
    access: public
    note: Long historical annual series of real per-capita GDP and consumption for advanced and emerging economies; freely downloadable from the authors' website.
  dfa:
    page: datasets/dfa
    name: Distributional Financial Accounts (DFA)
    provider: Federal Reserve Board
    access: public
    note: Quarterly distribution of U.S. household wealth across the wealth, income, age, and education distributions, reconciled to the Financial Accounts; published openly by the Fed.
  hrs:
    name: Health and Retirement Study (HRS)
    provider: University of Michigan / NIA
    access: public
    page: datasets/hrs
    note: >-
      Biennial longitudinal panel of U.S. households over age 50 covering
      health, wealth, portfolios, and survey expectations; public-use files are
      free to registered researchers (restricted detail requires a separate
      data-use agreement).
  fdic:
    name: FDIC institution data (Summary of Deposits, Quarterly Banking Profile)
    provider: Federal Deposit Insurance Corporation
    access: public
    page: datasets/fdic
    note: Bank branch locations and deposits (Summary of Deposits) and aggregate U.S. commercial-bank balance-sheet and income series (Quarterly Banking Profile); published openly by the FDIC.
  clarity-services:
    name: Clarity Services alternative-credit bureau
    provider: Clarity Services (Experian)
    access: licensed-commercial
    note: Loan-level records on payday, installment, and other subprime/alternative credit products from a specialty credit bureau; obtained under a commercial research licence.
  equifax:
    name: Equifax consumer credit data
    provider: Equifax
    access: licensed-commercial
    note: Individual-level traditional credit-bureau records (installment and revolving balances, limits, credit scores, balances in good standing); obtained under a commercial research licence.

  # ---- JF 80(2)+80(1) batch ----
  epa-tri:
    name: EPA Toxics Release Inventory (TRI)
    provider: U.S. Environmental Protection Agency
    access: public
    page: datasets/epa-tri
    note: Facility-level annual reports of toxic chemical releases and waste management; openly downloadable from the EPA.
  fdic-sod:
    name: FDIC Summary of Deposits
    provider: Federal Deposit Insurance Corporation
    access: public
    note: Annual branch-level deposit data for U.S. banks and thrifts; openly downloadable. (See also fdic-summary-of-deposits, fdic.)
  federal-register:
    name: Federal Register
    provider: U.S. National Archives / GPO
    access: public
    page: datasets/federal-register
    note: Daily journal of U.S. federal agency rules, proposed rules, and notices; full text openly downloadable and via API.
  nmls:
    name: NMLS Consumer Access
    provider: Nationwide Multistate Licensing System (CSBS)
    access: public
    note: Public registry of licensed mortgage loan officers and their employers, work addresses, and career history; openly searchable.
  noaa-hurricane:
    name: NOAA hurricane track and landfall data (HURDAT2 / NHC)
    provider: NOAA National Hurricane Center
    access: public
    page: datasets/noaa-hurricane
    note: Historical tropical-cyclone tracks, intensities, and landfall locations; openly downloadable.
  qwi-census:
    name: Quarterly Workforce Indicators (QWI)
    provider: U.S. Census Bureau (LEHD)
    access: public
    note: Local labor-market statistics (employment, earnings, job creation) by geography, industry, and demographics; openly downloadable.
    page: datasets/qwi-census
  sba-loans:
    page: datasets/sba-loans
    name: SBA loan-level data (7(a) and 504)
    provider: U.S. Small Business Administration
    access: public
    note: Loan-level records of SBA-guaranteed small-business loans (amount, rate, lender, geography); openly published.
  tnic:
    name: Text-based Network Industry Classifications (TNIC)
    provider: Hoberg-Phillips Data Library
    access: public
    note: Firm-pair textual product-similarity scores and industry classifications built from 10-K product descriptions; openly downloadable from the Hoberg-Phillips Data Library.
  uniswap-blockchain:
    name: Uniswap on-chain data (Ethereum)
    provider: Ethereum public blockchain
    access: public
    note: Liquidity injections, withdrawals, and token swaps for Uniswap V1/V2 pools; readable directly from the public Ethereum blockchain.
  kld:
    name: KLD / MSCI ESG ratings
    provider: MSCI (formerly KLD Research & Analytics)
    access: licensed-commercial
    note: Firm-level environmental, social, and governance strength/concern ratings for U.S. public firms; licensed, commonly accessed via WRDS.
  markit:
    page: licensed/markit
    name: Markit (IHS Markit) bond pricing (composite quotes)
    provider: IHS Markit (S&P Global)
    access: licensed-commercial
    note: Daily composite price quotes for individual bonds and dealer-contribution counts; obtained under a commercial data licence. Single-name CDS is the separate markit-cds entry.
  optionmetrics:
    name: OptionMetrics IvyDB
    provider: OptionMetrics
    access: licensed-commercial
    note: Daily option prices, implied volatilities, and Greeks for U.S.-listed equities; licensed, commonly accessed via WRDS.
  refinitiv-transcripts:
    name: Refinitiv (LSEG) earnings-call transcripts
    provider: Refinitiv / LSEG
    access: licensed-commercial
    note: Transcripts of analyst-management conference calls; obtained under a commercial data licence.
  siblis-research:
    name: Siblis Research index-constituent and market-value data
    provider: Siblis Research
    access: licensed-commercial
    note: Historical S&P 500 / MidCap 400 / SmallCap 600 addition and deletion dates and constituent market values; sold by subscription.
  fr-2052a:
    name: FR 2052a Complex Institution Liquidity Monitoring Report
    provider: Federal Reserve (confidential)
    access: proprietary-confidential
    note: Confidential bank liquidity-flow reporting (inflows, outflows, funding by counterparty and maturity); restricted supervisory access.
  fr2004c:
    name: FR 2004C Weekly Government Securities Dealer positions (dealer-level)
    provider: Federal Reserve Bank of New York (confidential)
    access: proprietary-confidential
    note: Confidential dealer-level positions and financing for primary government securities dealers; only aggregates are published.
  ficc-gcf-repo:
    name: FICC GCF Repo Service data (dealer-level)
    provider: DTCC / FICC via FRBNY (confidential)
    access: proprietary-confidential
    note: Dealer-level daily interdealer general-collateral repo and reverse repo by asset class; licensed through the FRBNY under restricted terms.
  fha:
    page: datasets/fha
    name: FHA single-family loan-level data (confidential)
    provider: U.S. Department of Housing and Urban Development (confidential)
    access: proprietary-confidential
    note: Loan-level FHA originations and performance matched to applicant detail; the matched confidential version used in the source paper is proprietary, not the public portfolio snapshot.
  fdic-failed-bank:
    name: FDIC failed-bank bidding and resolution records
    provider: Federal Deposit Insurance Corporation (confidential)
    access: proprietary-confidential
    note: Proprietary bid-level records for resolved bank failures (bidder identities, bid terms, loss-share claims); restricted FDIC access.
  osfi-canada:
    name: OSFI federally regulated lender administrative data (Canada)
    provider: Office of the Superintendent of Financial Institutions (Canada)
    access: proprietary-confidential
    note: Contract-level mortgage records (lender identity, loan size, rate, amortization, LTV, debt-service ratio) for federally regulated Canadian lenders; restricted supervisory access (via Bank of Canada).
  transunion-canada:
    name: TransUnion credit bureau data (Canada)
    provider: TransUnion Canada (confidential research access)
    access: proprietary-confidential
    note: Monthly population-wide individual credit-bureau records (borrower characteristics, mortgage identity, switching, inquiries); restricted research access, not an off-the-shelf purchase.

  # ---- RFS hhaf (2025) batch ----
  shiller-data:
    name: Robert Shiller online data (U.S. stock market, CAPE, home prices)
    provider: Robert J. Shiller (Yale)
    access: public
    page: datasets/shiller-data
    note: Long monthly series of S&P prices, dividends, earnings, the cyclically adjusted P/E (CAPE), and the long-run home price index; freely downloadable from shillerdata.com (Yale mirror). Canonical slug; shiller-irrational-exuberance collapses here.
  steelbenchmarker:
    name: SteelBenchmarker steel price index
    provider: World Steel Dynamics / American Metal Market
    access: licensed-commercial
    note: Biweekly reference prices for hot-rolled band, cold-rolled coil, and other steel products; current spot reports are free but the full historical product-level series is a subscription product (the source paper calls it a proprietary price database).
  cra-ffiec:
    name: Community Reinvestment Act (CRA) disclosure data
    provider: FFIEC
    access: public
    note: Bank small-business and small-farm lending by census tract under the CRA; aggregate and disclosure files published openly by the FFIEC.
  fannie-freddie:
    name: Fannie Mae / Freddie Mac single-family loan-level datasets
    provider: Fannie Mae / Freddie Mac
    access: public
    note: Loan-level acquisition and performance records for single-family mortgages acquired by the GSEs; freely downloadable after a no-cost registration.
  facebook-sci:
    name: Facebook Social Connectedness Index (SCI)
    provider: Meta Data for Good
    access: public
    note: County- and region-pair index of relative friendship-link intensity built from anonymized Facebook friendships; freely available to researchers via the Humanitarian Data Exchange.
  csmar:
    name: China Stock Market & Accounting Research (CSMAR) database
    provider: GTA Information Technology
    access: licensed-commercial
    note: Vendor database of Chinese listed-firm prices, financials, and market microstructure; obtained under a commercial / institutional licence.
  china-shadow-margin:
    name: China shadow-margin (off-exchange) lending data (single provider)
    provider: Undisclosed large shadow-margin platform (confidential)
    access: proprietary-confidential
    note: Daily stock-level off-exchange ("shadow") margin balances from one large lending platform (about 5% of the market), used for the 2015 bust analysis; a single private counterparty's records, not purchasable off the shelf.
  bureau-van-dijk-zephyr:
    name: Bureau van Dijk Zephyr (M&A and deals)
    provider: Moody's / Bureau van Dijk
    access: licensed-commercial
    note: Global database of M&A, IPO, private-equity, and venture deals; obtained under a commercial vendor licence.
  ztrax:
    name: Zillow Transaction and Assessment Dataset (ZTRAX)
    provider: Zillow
    access: licensed-commercial
    note: Property-level transactions and assessor records; was distributed free to academics under a Zillow data-use agreement (program discontinued 2023), not an open download.
  maryland-judiciary:
    name: Maryland Judiciary Case Search records
    provider: Maryland Judiciary
    access: public
    note: Individual-level state court case records (charges, hearings, dispositions) retrieved from the free public Case Search portal.
  pacer-bankruptcy:
    name: PACER federal bankruptcy court records
    provider: U.S. Administrative Office of the Courts (PACER)
    access: public
    note: Case-level federal bankruptcy filings and dockets; open to any registered user, billed per page (nominal fees, waivable), not a commercial vendor product.
  insee-dads:
    name: INSEE DADS matched employer-employee data (France)
    provider: INSEE (via CASD)
    access: proprietary-confidential
    note: Administrative declarations linking French workers to establishments (earnings, occupation, hours); restricted access through the CASD secure data centre.
  insee-lifi:
    name: INSEE LIFI financial linkages between firms (France)
    provider: INSEE (via CASD)
    access: proprietary-confidential
    note: Administrative survey of ownership and control links among French firms (group structure); restricted access through the CASD secure data centre.
  insee-tax-files:
    name: INSEE firm tax and accounting files (France)
    provider: INSEE / DGFiP (via CASD)
    access: proprietary-confidential
    note: Administrative firm-level tax and accounting records (balance sheets, income statements); restricted access through the CASD secure data centre.
