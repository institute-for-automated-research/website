    provider: U.S. Bureau of Economic Analysis
    access: public
    note: Detailed capital stock and investment by asset type and industry; freely downloadable from the BEA.
  burning-glass:
    name: Burning Glass / Lightcast job postings
    provider: Lightcast (formerly Burning Glass Technologies)
    access: licensed-commercial
    note: Near-universe of online US job vacancies with skill and occupation tags scraped from employer postings; obtained under a vendor research licence.
  census-of-governments:
    name: Census of Governments
    provider: U.S. Census Bureau
    access: public
    note: Finances, employment, and organization of state and local governments; freely downloadable from the Census Bureau.
  clearspending:
    name: ClearSpending procurement data
    provider: ClearSpending.ru (civil-society project)
    access: public
    note: Openly published anomalies and records derived from the Russian federal procurement register; freely accessible.
  cms-medicare:
    name: CMS Medicare claims and Part D records
    provider: U.S. Centers for Medicare and Medicaid Services
    access: proprietary-confidential
    note: Individual-level Medicare enrollment, claims, and Part D prescription-drug event records; research-identifiable files require a data use agreement through ResDAC.
  cps:
    name: Current Population Survey (CPS)
    provider: U.S. Census Bureau / Bureau of Labor Statistics
    access: public
    note: Monthly household labor-force survey; public-use microdata freely downloadable (and via IPUMS-CPS).
  cps-dws:
    name: CPS Displaced Worker Supplement (DWS)
    provider: U.S. Census Bureau / Bureau of Labor Statistics
    access: public
    note: Biennial CPS supplement on job displacement and post-displacement outcomes; public-use microdata freely downloadable.
  cps-org:
    name: CPS Outgoing Rotation Group (ORG)
    provider: U.S. Census Bureau / Bureau of Labor Statistics
    access: public
    note: CPS earnings and hours files for outgoing rotation households; public-use microdata freely downloadable.
  dhs:
    name: Demographic and Health Surveys (DHS)
    provider: USAID DHS Program
    access: public
    note: Standardized household and individual surveys on health, fertility, and demographics across developing countries; microdata free to researchers after registration.
  dot:
    name: Dictionary of Occupational Titles (DOT)
    provider: U.S. Department of Labor
    access: public
    note: Occupational task and requirement descriptors for US jobs; freely available historical reference data.
  faads:
    name: Federal Assistance Award Data System (FAADS)
    provider: U.S. Census Bureau / USAspending
    access: public
    note: Federal domestic assistance awards by program, recipient, and geography; freely downloadable (predecessor of USAspending.gov).
  informacao-empresarial-simplificada:
    name: Informacao Empresarial Simplificada (IES)
    provider: Portugal (filed with the Ministry of Justice; accessed via Banco de Portugal)
    access: proprietary-confidential
    note: Mandatory annual firm accounting and balance-sheet filings for Portuguese firms; restricted research access through the central bank.
  klarner-partisan-data:
    name: Klarner state partisan-balance data
    provider: Carl Klarner (academic compilation)
    access: public
    note: Partisan composition of US state legislatures and governorships over time; freely available academic dataset.
  onet:
    name: O*NET occupational database
    provider: U.S. Department of Labor
    access: public
    note: Standardized occupational descriptors (skills, abilities, tasks, work context); freely downloadable.
  rosstat:
    name: Rosstat firm and statistical databases
    provider: Russian Federal State Statistics Service (Rosstat)
    access: public
    note: Official Russian firm registers and statistical series used to match procurement and financial records; published by Rosstat.
  ruslana:
    name: Ruslana Russian firm financials
    provider: Bureau van Dijk (Moody's)
    access: licensed-commercial
    note: Financial statements and ownership for Russian companies; obtained under a Bureau van Dijk subscription.
  trains-unctad:
    name: UNCTAD TRAINS tariff data
    provider: UNCTAD (via World Bank WITS)
    access: public
    note: Bilateral applied and bound tariffs and non-tariff measures by product; freely accessible through WITS.
  zakupki:
    name: Russian federal procurement register (zakupki)
    provider: Russian Federal Treasury (EIS, zakupki.gov.ru)
    access: public
    note: Public register of Russian federal and municipal government procurement contracts; openly published on the official portal.

  # ---- AER 2023 batch 3 ----
  aids-public-info:
    name: AIDS Public Information Dataset (APIDS)
    provider: U.S. Centers for Disease Control and Prevention
    access: public
    note: Annual and cumulative AIDS case counts aggregated to metro area and demographic strata; public-use file freely distributed by the CDC.
  cces:
    name: Cooperative Election Study (CCES/CES)
    provider: Harvard (CES consortium, via Dataverse)
    access: public
    note: Large annual US survey of political attitudes and voting, tens of thousands of respondents per wave; public-use microdata freely downloadable from the Harvard Dataverse.
  cdc-hiv-surveillance:
    name: CDC HIV surveillance data (special request)
    provider: U.S. Centers for Disease Control and Prevention
    access: proprietary-confidential
    note: City-level HIV diagnoses and prevalence obtained by special request from the CDC; sub-national detail is restricted and not openly downloadable.
  eia:
    name: U.S. Energy Information Administration data
    provider: U.S. Energy Information Administration
    access: public
    note: Energy prices and production series (e.g. Henry Hub gas, WTI oil) and shale formation geology; freely downloadable from the EIA. (Electricity-specific series have a separate page, eia-electricity.)
  eurostat-esa:
    name: Eurostat European System of Accounts (ESA)
    provider: Eurostat
    access: public
    note: Harmonized national accounts for EU member states (output, prices, consumption, investment, labor); freely downloadable from Eurostat.
  factiva:
    name: Factiva
    provider: Dow Jones
    access: licensed-commercial
    note: Full-text archive of newswires and newspapers (incl. AP dispatches); searchable under a Dow Jones institutional subscription.
  nexis-uni:
    name: Nexis Uni news database
    provider: LexisNexis (RELX)
    access: licensed-commercial
    note: Full-text news article archive (formerly LexisNexis Academic); accessed under an institutional library subscription.
  seer:
    name: SEER population data
    provider: U.S. National Cancer Institute (SEER program)
    access: public
    note: County and metro population denominators by age, sex, race used to convert counts to rates; population files freely downloadable from SEER.
  swanson-fomc-shocks:
    name: Swanson (2021) FOMC monetary policy shocks
    provider: Eric Swanson (academic replication data)
    access: public
    note: Decomposed federal funds rate, forward guidance, and asset purchase shocks identified from FOMC announcement windows; freely posted as replication data.
  texas-glo:
    name: Texas General Land Office oil and gas lease records
    provider: Texas General Land Office
    access: public
    note: Bonus payments, terms, royalty rates, and royalty production for state oil and gas leases, plus auction bid notices; public records released by the Texas GLO.
  vital-statistics:
    name: National Vital Statistics mortality files
    provider: U.S. National Center for Health Statistics (NCHS/CDC)
    access: public
    note: Cause-of-death mortality counts and rates; public-use files freely downloadable (and via CDC WONDER). Geographically detailed restricted-use Multiple Cause of Death files require an NCHS Research Data Center agreement.
  wu-xia-shadow-rate:
    name: Wu and Xia (2016) shadow policy rate
    provider: Cynthia Wu and Fan Dora Xia (academic series)
    access: public
    note: Shadow short-rate estimate spanning the zero lower bound period from a shadow-rate term-structure model; freely posted and updated by the authors.

  # ---- AER 2023 batch 4 ----
  awcs:
    name: American Working Conditions Survey (AWCS)
    provider: RAND Corporation
    access: public
    note: Stated-preference survey of US workers fielded on the RAND American Life Panel; job-attribute incidence and willingness-to-pay experiments. Data freely available from RAND (TL269).
  cex-us:
    name: Consumer Expenditure Survey (CEX)
    provider: U.S. Bureau of Labor Statistics
    access: public
    note: Household income and consumption-expenditure microdata; public-use files freely downloadable from the BLS.
  chicago-police-dept:
    name: Chicago Police Department arrest records
    provider: Chicago Police Department
    access: proprietary-confidential
    note: Individual-level arrest records linked to study participants under a research data-sharing agreement; not openly downloadable.
  comtrade:
    name: UN Comtrade
    provider: United Nations Statistics Division
    access: public
    note: Bilateral merchandise trade flows by product and partner (SITC/HS); freely accessible from the UN Comtrade database.
  cps-admin:
    name: Chicago Public Schools student administrative records
    provider: Chicago Public Schools
    access: proprietary-confidential
    note: Individual-level student records (test scores, GPA, attendance, discipline, enrollment) obtained under a research agreement; restricted, not openly downloadable. (Distinct from the Current Population Survey, slug cps.)
  datamyne:
    name: Datamyne customs trade transactions
    provider: Datamyne (Descartes Systems Group)
    access: licensed-commercial
    note: Firm-level customs import/export transaction records (e.g. Colombian customs); obtained under a commercial vendor subscription.
  eff-spain:
    name: Encuesta Financiera de las Familias (EFF)
    provider: Banco de Espana
    access: public
    note: Spanish Survey of Household Finances; anonymized public-use microdata on household assets, debt, income, and consumption freely distributed by the Bank of Spain.
  enaho-peru:
    name: Encuesta Nacional de Hogares (ENAHO)
    provider: INEI Peru
    access: public
    note: Peruvian National Household Survey; public-use income and consumption microdata freely downloadable from INEI.
  enigh-mexico:
    name: Encuesta Nacional de Ingresos y Gastos de los Hogares (ENIGH)
    provider: INEGI Mexico
    access: public
    note: Mexican National Household Income and Expenditure Survey; public-use microdata freely downloadable from INEGI.
  epf-spain:
    name: Encuesta de Presupuestos Familiares (EPF)
    provider: INE Spain
    access: public
    note: Spanish Household Budget Survey; public-use income and consumption microdata freely downloadable from the INE.
  italian-procurement:
    name: Italian government procurement auction data
    provider: Decarolis (replication data, via ICPSR)
    access: public
    note: Cost, delay, and overrun distributions for Italian public procurement auctions, estimated structurally by Decarolis; calibration inputs and replication data publicly available at ICPSR (E182801V1).
  rand-alp:
    name: RAND American Life Panel (ALP)
    provider: RAND Corporation
    access: public
    note: Probability-based internet panel of US adults used as a survey sampling frame and platform; microdata available to registered researchers via the RAND ALP data portal.
  shiw-italy:
    name: Survey on Household Income and Wealth (SHIW)
    provider: Banca d'Italia
    access: public
    note: Italian household survey of income, consumption, and wealth; public-use microdata freely downloadable from the Bank of Italy.
  wiod:
    name: World Input-Output Database (WIOD)
    provider: WIOD consortium (European Commission)
    access: public
    note: Harmonized world input-output tables with bilateral trade, industry production and expenditure shares, and tariff data; freely downloadable.
  xmrc:
    name: XMRC.com job-board records
    provider: XMRC.com (Chinese online recruitment platform)
    access: proprietary-confidential
    note: Internal applications, callbacks, job-ad gender labels, match scores, and resume data from a single Chinese job board; proprietary records provided by the platform.

  # ---- JBF 2026 batch 1 (issue #35, field tier) ----
  bis:
    name: Bank for International Settlements statistics
    provider: Bank for International Settlements
    access: public
    note: Cross-country credit, house-price, and banking-statistics series; freely downloadable from the BIS data portal.
  oecd:
    name: OECD statistics
    provider: Organisation for Economic Co-operation and Development
    access: public
    note: Cross-country macroeconomic, financial, and policy indicators; freely downloadable from OECD.Stat / OECD Data Explorer.
  imapp:
    name: Integrated Macroprudential Policy (iMaPP) database
    provider: International Monetary Fund (Alam et al.)
    access: public
    note: Monthly country-level dataset of macroprudential policy actions across instruments; freely downloadable from the IMF.
  global-q:
    name: q-factor and augmented q-factor data
    provider: Hou, Xue, and Zhang (global-q.org)
    access: public
    note: Monthly and annual q-factor (ROE, investment, size) and q5 return series; freely downloadable from global-q.org.
  wustl-pm25:
    name: Satellite-derived surface PM2.5 estimates
    provider: Washington University in St. Louis (van Donkelaar et al.)
    access: public
    note: Gridded global annual fine-particulate (PM2.5) concentration estimates from satellite, model, and monitor fusion; freely downloadable.
  china-real-estate-yearbook:
    name: China Real Estate Statistical Yearbook
    provider: National Bureau of Statistics of China
    access: public
    note: Published statistical yearbook of city-level real-estate investment, land supply, and housing transactions.
  china-marketization-index:
    name: NERI Marketization Index of China's provinces
    provider: Wang, Fan, and Hu (NERI)
    access: licensed-commercial
    note: Provincial marketization scores published as a periodic report/book; obtained through purchase of the published index volumes.
  fannie-mae:
    name: Fannie Mae Single-Family Loan Performance Data
    provider: Fannie Mae
    access: licensed-commercial
    note: Loan-level origination and performance records; free of charge but gated behind registration and acceptance of a data license agreement.
  freddie-mac:
    name: Freddie Mac Single-Family Loan-Level Dataset
    provider: Freddie Mac
    access: licensed-commercial
    note: Loan-level origination and performance records; free of charge but gated behind registration and acceptance of a data license agreement.
  asif:
    name: Annual Survey of Industrial Firms (China)
    provider: National Bureau of Statistics of China
    access: proprietary-confidential
    note: Firm-level administrative survey of above-scale Chinese industrial enterprises; restricted microdata, not openly distributed.
  ntsd:
    name: National Tax Survey Database (China)
    provider: State Taxation Administration and Ministry of Finance of China
    access: proprietary-confidential
    note: Firm-level administrative tax-survey microdata; restricted access, not openly distributed.
  china-land-transaction:
    name: China Land Transaction Monitoring System
    provider: Ministry of Natural Resources of China
    access: proprietary-confidential
    note: Parcel-level land-sale records (price, area, use, buyer); administrative registry, not openly downloadable in bulk.
  esr-china:
    name: Chinese Environmental Statistics Report database
    provider: Ministry of Ecology and Environment of China
    access: proprietary-confidential
    note: Firm-level pollution-emissions and abatement records; restricted administrative environmental-statistics microdata.

  # ---- JEF + JFM 2026 batch 2 (issue #35, lower tier) ----
  welch-goyal:
    name: Welch-Goyal equity premium predictor data
    provider: Amit Goyal (updated annually)
    access: public
    note: Monthly and annual market-return predictor variables from Welch and Goyal (2008); freely downloadable from the author's website.
  wid:
    name: World Inequality Database
    provider: WID.world (Paris School of Economics)
    access: public
    note: Cross-country series on the distribution of income and wealth; freely downloadable from WID.world.
  mergent-fisd:
    name: Mergent Fixed Income Securities Database (FISD)
    provider: Mergent / ICE (via WRDS)
    access: licensed-commercial
    note: Bond-level characteristics (issuer, maturity, coupon, offering amount, ratings) for US corporate bonds; obtained through a WRDS / FISD subscription.
  bhps:
    name: British Household Panel Survey
    provider: UK Data Service (ISER, University of Essex)
    access: licensed-commercial
    note: Individual- and household-level longitudinal survey microdata; free of charge but gated behind UK Data Service registration and an End User Licence for non-commercial research.
  dol:
    name: DOL Form 5500 Private Pension Plan Research Files
    provider: U.S. Department of Labor (EBSA)
    access: public
    note: Plan-level filings on private pension plans (employer contributions, participants); freely downloadable from the Department of Labor.
  russell-index:
    name: Russell 1000/2000 index constituents and reconstitution rankings
    provider: FTSE Russell
    access: licensed-commercial
    note: Annual index-membership lists and end-of-May reconstitution market-cap rankings; proprietary index data, licensed from FTSE Russell or vendors.
  midas:
    name: SEC Market Information Data Analytics System (MIDAS)
    provider: U.S. Securities and Exchange Commission
    access: public
    note: Security-level market-structure metrics (order events, cancel-to-trade, depth) built from consolidated equity feeds; metrics published by the SEC at sec.gov/marketstructure.
  resset:
    name: RESSET Financial Research Database
    provider: Beijing Gildata RESSET Data Technology
    access: licensed-commercial
    note: Chinese capital-market data including fund holdings and returns; commercial subscription database.
  bse-intraday:
    name: Bombay Stock Exchange trader-level intraday transactions
    provider: Bombay Stock Exchange (BSE)
    access: proprietary-confidential
    note: Trader-identified intraday transaction records from the BSE; restricted data provided to researchers, not purchasable off the shelf.
  cmie-prowess:
    name: CMIE Prowess
    provider: Centre for Monitoring Indian Economy
    access: licensed-commercial
    note: Firm-level financial statements and market data for Indian companies; commercial subscription database.
  uspto:
    name: USPTO patent grants (PatentsView / bulk-data)
    provider: U.S. Patent and Trademark Office
    access: public
    note: Granted-patent records with filing/grant dates, CPC classes, and backward/forward citations; published openly via PatentsView and USPTO bulk data.
  patentsview:
    name: PatentsView
    provider: U.S. Patent and Trademark Office
    access: public
    note: Disambiguated USPTO patent, inventor, and assignee data with cross-firm inventor links; openly downloadable at patentsview.org.
  kpss:
    name: KPSS patent value database (Kogan, Papanikolaou, Seru & Stoffman 2017)
    provider: Authors' replication repository (GitHub / Noah Stoffman)
    access: public
    note: Stock-market-based economic value of patents and patent-to-firm matches; openly posted academic dataset.
  kpst:
    name: KPST patent technology database (Kelly, Papanikolaou, Seru & Taddy 2021)
    provider: Authors' replication repository (dimitris-papanikolaou.github.io)
    access: public
    note: Text-based patent technology classification and breakthrough-patent measures; openly posted academic dataset.
  marx-fuegi:
    name: Marx & Fuegi science-based patent data (2020, 2022)
    provider: Authors' replication repository
    access: public
    note: Patent-to-non-patent-literature citation links used to identify science-based patents; openly posted academic dataset.
  census-bds:
    name: Business Dynamics Statistics (BDS)
    provider: U.S. Census Bureau
    access: public
    note: Annual establishment- and firm-level entry, exit, job creation, and firm-count tabulations by industry; published openly by the Census Bureau.
  fdic-sdi:
    name: FDIC Statistics on Depository Institutions (SDI)
    provider: Federal Deposit Insurance Corporation
    access: public
    note: Quarterly call-report-derived balance-sheet, income, and condition data for FDIC-insured institutions; openly queryable at fdic.gov.
  boardex:
    name: BoardEx board and executive profiles
    provider: BoardEx (Altrata)
    access: licensed-commercial
    note: Director and executive biographies, board memberships, networks, and roles; commercial subscription, commonly accessed via WRDS.
  iss:
    name: ISS governance and incentives data
    provider: Institutional Shareholder Services (formerly RiskMetrics / IRRC)
    access: licensed-commercial
    note: Board independence, governance provisions, and director attributes; commercial subscription, commonly accessed via WRDS.
  euroclear-finland:
    name: Euroclear Finland securities registry
    provider: Euroclear Finland
    access: proprietary-confidential
    note: Individual-level daily holdings and trades for all Finnish-registered securities; restricted registry data provided to researchers, not purchasable off the shelf.
  alexander-incentives:
    name: Alexander Incentives stock-option plan data
    provider: Alexander Incentives (Finland)
    access: proprietary-confidential
    note: Individual-level employee and executive stock-option plan records for Finnish firms, identifying employment relationships for tens of thousands of individuals; restricted research access.
  optn:
    name: OPTN/UNOS transplant data (Standard Analysis Files)
    provider: Organ Procurement and Transplantation Network / United Network for Organ Sharing
    access: proprietary-confidential
    note: Patient-level waitlist, offer, and transplant records for deceased-donor organ allocation; released to researchers under a data use agreement, not purchasable off the shelf.
  lalonde-dehejia-wahba:
    name: NSW job-training experimental data (LaLonde; Dehejia-Wahba subsamples)
    provider: Authors' replication files (Rajeev Dehejia website)
    access: public
    note: Experimental and observational samples from the National Supported Work demonstration used as the standard benchmark for evaluating treatment-effect estimators; openly posted.
  fec:
    name: FEC campaign finance data
    provider: U.S. Federal Election Commission
    access: public
    note: Itemized contributions, disbursements, and committee filings for federal candidates and PACs; openly downloadable and queryable at fec.gov.
  cq-press:
    name: CQ Press voting and elections data
    provider: CQ Press (SAGE)
    access: licensed-commercial
    note: Congressional and electoral records including roll-call votes and district-level returns; commercial subscription product.
  bonica-dime:
    name: DIME (Database on Ideology, Money in Politics, and Elections)
    provider: Adam Bonica (Stanford)
    access: public
    note: Candidate and contributor campaign-finance records with estimated ideological (CFscore) measures across U.S. federal and state elections; openly posted academic dataset.
  polidata:
    name: Polidata election and demographic data
    provider: Polidata (Political Data, Inc.)
    access: licensed-commercial
    note: District-level election returns and demographic tabulations; commercial data product.
  ebay-best-offer:
    name: eBay Best Offer bargaining data
    provider: eBay (research extract)
    access: proprietary-confidential
    note: Listing-level sequential offer and counteroffer threads from eBay's Best Offer platform; firm-provided research extract, not publicly available.
  inps-italy:
    name: INPS administrative employer-employee data
    provider: Istituto Nazionale della Previdenza Sociale (Italy)
    access: proprietary-confidential
    note: Italian social-security matched employer-employee records with earnings and employment spells; restricted administrative microdata accessed under agreement.
  l488-italy:
    name: Law 488/1992 subsidy program records
    provider: Italian Ministry of Economic Development
    access: proprietary-confidential
    note: Firm-level applications, scores, and awards from Italy's Law 488/1992 capital-subsidy program; administrative records accessed under agreement.
  cbs-netherlands:
    name: CBS Netherlands microdata
    provider: Statistics Netherlands (Centraal Bureau voor de Statistiek)
    access: proprietary-confidential
    note: Individual- and household-level administrative registers (residence, income, demographics); accessed by authorized researchers through CBS remote-access under contract.
  inside-airbnb:
    name: Inside Airbnb
    provider: Inside Airbnb (independent project)
    access: public
    note: Scraped city-level Airbnb listing, location, price, and availability snapshots; openly downloadable at insideairbnb.com.
  amsterdam-city-data:
    name: City of Amsterdam open data
    provider: Gemeente Amsterdam
    access: public
    note: Municipal open datasets including neighborhood amenities, registrations, and geographic boundaries; openly published by the City of Amsterdam.
