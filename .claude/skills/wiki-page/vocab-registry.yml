# Controlled-but-growing vocabulary for the distilled-paper METHOD axes.
# Single source of truth for what each term MEANS. Usage stats (which papers
# use a term, first-seen year) are DERIVED at build from the pages, never
# stored here, so parallel distillers never collide on this file.
#
# Discipline:
# - A paper-distiller READS this file and reuses an existing term or one of its
#   aliases before minting. It NEVER writes here; new terms are staged on the
#   page in `paper.proposedVocab`.
# - The vocab-curator (one serial pass per batch) reconciles those proposals
#   into this file and rewrites pages to the canonical term.
# - Topic and method TAGS are governed separately by wiki-page/SKILL.md +
#   TagIndex.astro. This registry governs `methods.family`,
#   `methods.buildsFrom`, `mechanisms` (the economic-channel axis),
#   `findings[].metric` (the `metrics:` section), and `paper.outcomeClass`
#   (the `outcome-classes:` section).

family: # methods.family: the method class (also enum-backed in content.config.ts)
  ml:
    def: Machine-learning / statistical-learning method (trees, penalized regression, neural nets).
  structural:
    def: Estimates the parameters of an explicit economic model (utility, equilibrium, dynamic program).
  reduced-form-causal:
    def: Identifies a causal effect via a research design (DiD, IV, RD, event study) without a full structural model.
  theory:
    def: Derives propositions from a model; no estimation, or estimation is secondary.
  descriptive:
    def: Documents facts / measurement without a causal design or a structural model.

builds-from: # methods.buildsFrom: technique primitives a method is built on

  # ---- clustering ----
  k-means-clustering:
    def: K-Means unsupervised clustering algorithm grouping observations into k clusters by minimizing intracluster Euclidean distance; optimal k chosen via the Silhouette Method or elbow criterion.
    aliases: [k-means, kmeans-clustering, kmeans]

  # ---- portfolio and factor construction ----
  decision-trees:
    def: Recursive binary partitioning of the feature/characteristic space.
    aliases: [regression-trees, cart, classification-trees]
  conditional-sorts:
    def: Portfolio sorts where each split is conditional on the previous split (a tree), as opposed to unconditional double/triple sorts.
    aliases: [conditional-double-sorts]
  portfolio-sort:
    def: Ranking assets or agents into quantile buckets by a signal and computing equal- or value-weighted portfolio returns within each bucket.
    aliases: [decile-sort, anomaly-sort, characteristic-sort, investor-sort, quintile-sort]
  sdf-projection:
    def: Projecting the stochastic discount factor onto the space of (characteristic-managed) asset returns.
    aliases: [sdf-spanning]
  fama-macbeth:
    def: Cross-sectional regression run each period; time-series average of coefficients with Newey-West standard errors.
    aliases: [fm-regression, fama-macbeth-regression]

  # ---- penalized regression / shrinkage ----
  lasso:
    def: L1-penalized selection/shrinkage that induces sparsity.
    aliases: [l1-penalty]
  ridge-shrinkage:
    def: L2 penalty on coefficients/weights; covariance/variance shrinkage.
    aliases: [l2-penalty, variance-shrinkage]
  robust-mean-variance-optimization:
    def: Mean-variance/tangency portfolio with shrinkage of both the mean vector and the covariance matrix (elastic-net penalty).
    aliases: [robust-tangency, shrinkage-mve]

  # ---- panel / regression / causal-inference primitives ----
  panel-regression:
    def: OLS/GLS regression on a panel dataset with multi-way fixed effects and clustered standard errors.
    aliases: [panel-ols, panel-fe, twfe, multi-way-fe, fixed-effects-regression, two-way-clustered-regression, ols-panel, within-estimator, linear-probability-model, lpm, random-effects-panel, re-panel, random-effects-regression]
  difference-in-differences:
    def: Panel estimator comparing treated and control units before and after a quasi-natural experiment; includes stacked DiD and dynamic event-study variants.
    aliases: [diff-in-diff, DiD, did, stacked-did, differences-in-differences, staggered-did, staggered-treatment-did, stacked-did-panel]
  instrumental-variables:
    def: Estimation using an instrument correlated with the endogenous regressor but not the error; includes 2SLS and Bartik-style designs.
    aliases: [iv-estimation, 2sls, bartik-iv, IV, 2SLS, bartik-shift-share-iv, shift-share-bartik, hc-bartik]
  event-study:
    def: Cumulative abnormal return (CAR) estimation around a corporate event date, or a dynamic DiD specification plotting pre-trend and post-treatment coefficient paths.
    aliases: [car-estimation, abnormal-returns, dynamic-DiD, event-time-regression]
  probit-regression:
    def: Binary-outcome regression using the standard normal CDF as the link function; marginal effects interpreted as changes in probability.
    aliases: [probit]
  logit-regression:
    def: Binary-outcome regression using the logistic CDF as the link function; marginal effects interpreted as changes in probability.
    aliases: [logit, logistic-regression]
  blinder-oaxaca-decomposition:
    def: Decomposition of a mean difference between groups or periods into a portion explained by differences in covariates and an unexplained portion; attributed to Blinder (1973) and Oaxaca (1973).
    aliases: [oaxaca-decomposition, blinder-oaxaca]
  gmm:
    def: Generalized method of moments estimation; minimizes a quadratic form in sample moment conditions.
    aliases: [generalized-method-of-moments]
  method-of-simulated-moments:
    def: Estimation by minimizing weighted distance between model-simulated and empirical moments.
    aliases: [smm, msm, simulated-method-of-moments]

  # ---- time-series and forecasting ----
  kernel-regression:
    def: Local-constant (Nadaraya-Watson) regression with a kernel weighting function; one-sided kernel uses only past data, two-sided uses a symmetric window.
    aliases: [nadaraya-watson, local-constant-regression]
  time-series-forecasting:
    def: Predicting a scalar time series from lagged predictors; assessed by out-of-sample R-squared or Clark-West test against a prevailing-mean benchmark.
    aliases: [return-forecasting, predictive-regression]
  ar1-innovation:
    def: First-order autoregressive model residual used as a factor shock, estimated on a rolling forward basis to avoid look-ahead bias.
    aliases: [ar1-residual, ar-innovation]
  sign-restricted-svar:
    def: Structural VAR identified by sign restrictions on the impact matrix; estimated using Bayesian draws and the Cholesky decomposition to separate supply from demand shocks.
    aliases: [sign-svar, bayesian-svar]
  smooth-local-projections:
    def: Local projection impulse-response functions shrunk toward a smooth polynomial via penalized B-splines, balancing VAR efficiency and LP robustness.
    aliases: [slp, barnichon-brownlees]

  # ---- text and classification ----
  lda-topic-model:
    def: Latent Dirichlet Allocation applied to a large text corpus to extract topic distributions over documents; each document is a mixture of topics, each topic a distribution over words.
    aliases: [latent-dirichlet-allocation, lda]
  slda-text-classification:
    def: Dictionary-based paragraph-level classification of text into thematic channels, validated against latent Dirichlet allocation; used to identify economic mechanisms from textual disclosure.
    aliases: [dictionary-text-classification, hurricane-channel-nlp]
  slda-topic-model:
    def: Semisupervised latent Dirichlet allocation seeded with domain-knowledge words so topic content is stable across rolling re-estimations; estimated on a rolling window to avoid look-ahead bias.
    aliases: [seeded-lda, semisupervised-lda]
  text-classification:
    def: Machine-learning or rule-based assignment of text to sentiment or topic categories using classifiers such as maximum entropy, naive Bayes, random forests, or proprietary NLP tools.
    aliases: [sentiment-classification, nlp-classification, rf-classifier, random-forest-classifier, rf-text-classifier]
  llm-text-classification:
    def: Using a large language model prompted with a domain-expert role to classify, score, or extract structured information from free-form text such as meeting notes or earnings calls.
    aliases: [gpt-classification, llm-parsing]

  # ---- structural / life-cycle models ----
  life-cycle-model:
    def: Dynamic optimization model of consumption, saving, and portfolio choice over the working and retirement lifecycle.
    aliases: [lifecycle-model, life-cycle-portfolio-choice]
  epstein-zin-weil:
    def: Recursive utility preferences (Epstein-Zin 1989, Weil 1990) that separate risk aversion from the elasticity of intertemporal substitution.
    aliases: [ezw-preferences, recursive-utility]
  overlapping-generations:
    def: General equilibrium model in which multiple age cohorts coexist; agents born each period overlap with existing cohorts.
    aliases: [olg]
  krusell-smith:
    def: Approximate-aggregation method that forecasts aggregate capital with a low-dimensional statistic (moments of the wealth distribution) to solve heterogeneous-agent general equilibrium models.
    aliases: [krusell-smith-algorithm, approximate-aggregation]
  incomplete-markets-olg:
    def: General equilibrium with overlapping generations and idiosyncratic income risk that cannot be insured (no complete Arrow-Debreu markets).
    aliases: [incomplete-markets, olg-incomplete]
  blp-demand:
    def: Random-coefficient logit discrete-choice demand system identified by micro data on consumer choices and price responses, as in Berry-Levinsohn-Pakes.
    aliases: [berry-levinsohn-pakes, random-coefficient-logit]
  shapley-value-allocation:
    def: Game-theoretic attribution of a total welfare change to individual players by averaging marginal contributions over all orderings.
    aliases: [shapley-value]
  real-options:
    def: Investment model where a firm holds an option to expand capacity with irreversibility and an option value of waiting.
    aliases: [real-option-model, investment-options]
  dynamic-general-equilibrium:
    def: Multi-period general equilibrium model with households, firms, and possibly a social planner; here with explicit pollution externalities.
    aliases: [dge, general-equilibrium-model]
  pigouvian-taxation:
    def: Optimal corrective tax set equal to the social cost of the externality; applied here as a carbon tax equal to the social cost of carbon.
    aliases: [pigouvian-tax, corrective-tax]
  carbon-burden-rate:
    def: Ratio of a firm's untaxed carbon externality to its market value; the per-unit-value cost of a missing carbon tax.
    aliases: [externality-rate, emission-to-value-ratio]
  realization-utility:
    def: Utility bursts received only when gains or losses are realized by selling; prospect-theory-based framework for trading behavior and the disposition effect.
    aliases: [prospect-theory-trading, disposition-utility]
  hjb-optimal-stopping:
    def: Hamilton-Jacobi-Bellman equation approach to optimal stopping and free-boundary problems; characterizes value functions in holding vs. realization domains.
    aliases: [hjb-variational-inequality, free-boundary-problem]
  impulse-control:
    def: Optimal control with discrete interventions (trades) at stopping times chosen by the agent; leads to variational inequalities at realization boundaries.
    aliases: [optimal-stopping-control]
  promotion-contest:
    def: Model in which agents compete for a single promotion by investing in observable skills; equilibrium effort is determined by the promotion premium and cost parameters.
    aliases: [promotion-tournament, rank-order-tournament]
  principal-agent:
    def: Framework with a principal who designs contracts and agents who choose costly actions; here the principal cannot commit to unbiased promotion.
    aliases: [principal-agent-model]
  revealed-preference:
    def: Inferring preferences from observed active choices under variation in defaults or frames, following the Goldin-Reck framework for continuous portfolio-share decisions.
    aliases: [revealed-preference-analysis]
  matching:
    def: Propensity-score or covariate matching of treated units to control units on pre-treatment observables to construct a comparison group.
    aliases: [propensity-score-matching, covariate-matching, cell-matching, covariate-cell-matching]
  affine-term-structure:
    def: No-arbitrage pricing model where log bond prices are affine functions of state variables; yields are linear in the state vector.
    aliases: [atsm, affine-pricing-model]
  extended-kalman-filter:
    def: Nonlinear state-space estimation method that approximates the Kalman filter via first-order Taylor expansion of nonlinear measurement equations; used for maximum-likelihood estimation of structural models.
    aliases: [ekf]
  unscented-kalman-filter:
    def: Nonlinear state-space estimator that propagates the state distribution through observation and transition equations via deterministic sigma points, avoiding the linearization error of the extended Kalman filter.
    aliases: [ukf, sigma-point-kalman-filter]
  gamma-zero-processes:
    def: Discrete-time non-negative jump processes built as sums of exponentially distributed jumps with a Poisson count; provide closed-form affine pricing formulas for credit and liquidity events.
    aliases: [varg, gamma-zero]
  roc-curve-analysis:
    def: Receiver-operating-characteristic framework mapping the trade-off between true positive rate and false positive rate for a binary classifier at varying thresholds.
    aliases: [roc-curve, receiver-operating-characteristic]
  value-function-iteration:
    def: Numerical solution of a Bellman equation by iterating on the value function over a discretized state space.
    aliases: [vfi, bellman-iteration]

  # ---- survival analysis ----
  survival-analysis:
    def: Cox proportional hazards model or Kaplan-Meier estimator for time-to-event data; baseline hazard stratified by industry or cohort.
    aliases: [cox-proportional-hazards, hazard-model, kaplan-meier]

  # ---- exchange rate and currency models ----
  quanto-implied-risk-premium:
    def: Risk-neutral covariance between exchange rate and equity market returns extracted from quanto forward prices; the QRP of Kremens and Martin (2019).
    aliases: [qrp, quanto-forward-pricing]

  # ---- structural credit models ----
  bc-structural-model:
    def: Black-Cox (1976) structural model of corporate default with a flat default boundary for coupon-bearing bonds; model-implied credit spread decomposes into default risk premium and recovery.
    aliases: [black-cox-model, bc-model]

  # ---- structural firm dynamics ----
  arpl-mrpl-dynamics:
    def: Dynamic firm heterogeneity model in which firms differ in the ratio of average-revenue-product-of-labor to marginal-revenue-product-of-labor, capturing rent share and labor intensity differences across cohorts.
    aliases: [arpl-mrpl-ratio-model, revenue-employment-divergence]

  # ---- segmented-markets housing and asset pricing ----
  segmented-markets-lucas-tree:
    def: Two-type OLG model with separate Lucas trees for stocks and housing, connected only through a bond or credit market; households trade only their type-specific asset plus bonds.
    aliases: [segmented-markets-housing-model]

  # ---- index decomposition ----
  index-effect-decomposition:
    def: Decomposition of average abnormal index-event returns into a demand multiplier M and a net demand shock D, separately accounting for migrations versus direct additions/deletions, to identify whether declining returns reflect a smaller shock or a more elastic supply response.
    aliases: [price-impact-decomposition, m-times-d-decomposition]

  # ---- NLP embedding methods ----
  doc2vec-nlp:
    def: doc2vec word-embedding model mapping firm 10-K product descriptions to a continuous semantic vector space, enabling textual similarity scoring across industry dialects.
    aliases: [d2v, doc2vec-embedding, doc2vec-scope]

  # ---- intermediary heterogeneity ----
  heterogeneous-elasticity-intermediation:
    def: Model in which intermediaries differ in elasticity of substitution between two assets; aggregate elasticity falls as more-elastic intermediaries exhaust their positions and drop out, amplifying supply-shock price impact.
    aliases: [corner-solution-intermediation, heterogeneous-intermediary-model]

  # ---- heterogeneous-agent macro models ----
  d-hank-model:
    def: Analytical heterogeneous-agent New Keynesian model with Poisson aggregate disaster shocks and heterogeneous beliefs about disaster probability, yielding a tractable four-equation system via approximate block-recursivity.
    aliases: [disaster-hank, rare-disaster-hank]

  # ---- leave-out instrumental variable ----
  leave-out-mean-iv:
    def: Leave-out mean instrument that averages a decision-maker's residualized choices over all cases except those involving the focal unit in the same period; removes mechanical own-case correlation while preserving cross-unit leniency variation.
    aliases: [jackknife-iv, leave-one-out-iv, residualized-lom]

  # ---- anticipatory price models ----
  anticipatory-credit-pricing-model:
    def: Dynamic competitive stock-pricing model with heterogeneous investors in which deep-pocketed unconstrained investors gradually receive signals about an upcoming credit supply shock and front-run the price impact; generates an exponential anticipatory pre-trend parameterized by a rate-of-anticipation theta and a direct effect delta.
    aliases: [information-revelation-credit-model, credit-anticipation-model]

  # ---- deterministic-slope forecasting ----
  conservative-slope-forecast:
    def: Equity premium forecast that sets the predictive slope to a small positive constant (1/A based on sign inference) instead of estimating it by OLS; matches the historical average estimation variance (zero) while reducing bias when the population slope is nonzero.
    aliases: [deterministic-slope-forecast, bias-reduction-forecast]

  # ---- blockchain security models ----
  pow-vs-pos-security-model:
    def: OLG equilibrium model comparing security and adoption across Proof-of-Work and Proof-of-Stake blockchain protocols via attacker incentive compatibility and validator investment.
    aliases: [blockchain-security-model, consensus-protocol-model]

  # ---- causal inference / identification ----
  regression-discontinuity-design:
    def: Sharp or fuzzy regression discontinuity design exploiting an exogenous threshold in a running variable to identify a causal effect locally around the cutoff.
    aliases: [rdd, sharp-rdd, fuzzy-rdd, regression-discontinuity]

  trilemma-iv:
    def: Instrumental variable strategy exploiting the Mundell international finance trilemma; countries with fixed exchange rates and open capital accounts track base-country monetary policy, so residualized base-country rate changes instrument the peg-country rate change.
    aliases: [mundell-trilemma-iv, trilemma-instrument]

  # ---- principal-agent and compensation models ----
  compensation-externality-ge:
    def: General equilibrium model in which each firm's compensation package raises the equilibrium outside option for all managers, undermining termination as an incentive device and generating a pecuniary externality.
    aliases: [competitive-compensation-externality]

  # ---- factor analysis and dimension reduction ----
  factor-analysis-pca:
    def: Principal-components or factor analysis used to extract a low-dimensional summary score from a high-dimensional set of measures.
    aliases: [principal-component-analysis, pca-factor]

  # ---- machine-learning causal inference ----
  causal-forest:
    def: Machine-learning estimator that builds on generalized random forests to estimate heterogeneous treatment effects at the individual level; cross-fitted rankings used for subgroup selection to avoid overfitting bias.
    aliases: [generalized-random-forest, grf]

  # ---- repeat-sales index methods ----
  bayesian-repeat-sales:
    def: Repeat-sales house price index estimated using Bayesian methods to handle thin markets with few transactions.
    aliases: [repeat-sales-bayesian, thin-market-repeat-sales]

  # ---- negotiated price and switching costs ----
  dynamic-negotiated-price-game:
    def: T-period finite game of price negotiation where a home bank makes a first-mover initial quote, borrowers choose search intensity, and competing lenders bid in a descending English procurement auction with forward-looking incumbency advantage.
    aliases: [negotiated-price-competition, invest-harvest-game]

  # ---- effort measurement ----
  bloomberg-awl-effort-measure:
    def: Average workday length derived from minute-by-minute Bloomberg platform online status via an EM algorithm on a Gaussian mixture model of intraday activity; estimates the span between start and end of the executive workday.
    aliases: [awl-measure, bloomberg-effort-proxy]

  # ---- OTC search-and-bargaining models ----
  search-bargaining-otc:
    def: Search-and-matching model where buyers and sellers meet at Poisson intensity and face bilateral bargaining over price and timing; generates endogenous trade delays and liquidity dispersion across asset qualities.
    aliases: [search-frictions, search-and-matching-otc, otc-search-model]

  # ---- leverage and funding decomposition ----
  leverage-demand-supply-var:
    def: Structural VAR that decomposes aggregate broker-dealer leverage innovations into demand and supply shocks, identified by sign restrictions combined with asset-pricing moment conditions that yield closed-form structural parameter estimates.
    aliases: [leverage-shock-decomposition, structural-leverage-var]

  # ---- race imputation ----
  bifsg-race-imputation:
    def: Bayesian Improved First Name Surname Geocoding method that infers individual race/ethnicity probabilities from first name, last name, and ZIP code using Census name lists and location-race priors.
    aliases: [bifsg, bayesian-surname-geocoding]

  # ---- supervised PCA and factor screening ----
  spca-screening:
    def: Supervised PCA procedure that at each step screens test assets by correlation with a target factor before applying PCA to extract one latent factor, then projects out that factor before the next iteration.
    aliases: [supervised-pca, spca]

  # ---- discrete-choice demand with latent types ----
  latent-class-logit:
    def: Mixture logit model with discrete latent classes capturing unobserved preference heterogeneity; class membership probabilities and class-specific parameters estimated jointly via maximum likelihood.
    aliases: [latent-class-model, finite-mixture-logit]

  # ---- monetary policy transmission models ----
  information-channel-fg:
    def: Partial-equilibrium model of forward-guidance information effects; the central bank holds a private signal about economic fundamentals and FG announcements reveal that signal, shifting investor beliefs about growth and risk aversion and dominating the conventional interest-rate channel during high-uncertainty periods.
    aliases: [fg-information-channel, delphic-fg-model]

  # ---- rational expectations and search models ----
  noisy-rational-expectations:
    def: Rational-expectations equilibrium model (Grossman-Stiglitz type) in which the equilibrium price aggregates informed traders' signals plus noise-trader demand; price informativeness is measured by the inverse of residual variance.
    aliases: [gre-model, noisy-re-equilibrium, grossman-stiglitz]
  sequential-search-model:
    def: Search model in which an agent conducts multiple rounds of exploration, each costing c and yielding a draw from a quality distribution; the agent stops when the draw exceeds a threshold determined by a stopping rule.
    aliases: [optimal-stopping-search, satisficing-search]

  # ---- Bayesian and information-design methods ----
  hierarchical-bayesian-mcmc:
    def: Hierarchical Bayesian model estimated by Hamiltonian Monte Carlo; country-specific parameters drawn from a common hyperprior, updated via Bayes rule across a cross-section of units, yielding shrinkage toward the global mean.
    aliases: [hierarchical-beta-bernoulli, hmc-bayesian-learning]

  bayesian-persuasion:
    def: Information-design framework in which a sender commits to a signal policy to maximize an objective over the receiver's posterior beliefs, subject to the Bayes plausibility constraint; solved via concavification of the value function over posteriors.
    aliases: [concavification, information-design, kamenica-gentzkow]

  # ---- stress-test learning and control ----
  kalman-filter-learning:
    def: Bayesian updating of a principal's beliefs about unobserved agent exposures via a Kalman filter applied to reported stress test results; posterior mean and variance derived in closed form from prior covariance and scenario matrix.
    aliases: [kalman-filter-stress-test, linear-gaussian-learning]
  linear-quadratic-regulator:
    def: Regulator's intervention problem under linear-quadratic preferences over banking system net worth; first-order conditions yield closed-form capital requirements and targeted interventions linear in posterior mean exposures.
    aliases: [linear-quadratic-intervention, lq-banking-regulation]

  # ---- banking and deposit models ----
  deposit-dynamics-diffusion:
    def: Bank deposit stock modeled as a diffusion process partially controlled by the bank via the deposit rate, capturing sticky liabilities with stochastic payment flows and a ZLB constraint on the deposit rate.
    aliases: [deposit-stock-diffusion, stochastic-deposit-model]

  # ---- sovereign bond and monetary union models ----
  heterogeneous-monetary-union-atsm:
    def: Affine term structure model extended to a two-country monetary union where one sovereign faces rollover-crisis default risk; yields decompose into expectations, term premium, expected default loss, and credit risk premium components.
    aliases: [sovereign-default-atsm, multicountry-atsm]

  # ---- game-theoretic models ----
  repeated-game:
    def: Model in which a stage game is played repeatedly by the same players with a common discount factor; equilibria include cooperation sustained by credible punishment strategies.
    aliases: [supergame, infinitely-repeated-game]
  repeated-extensive-form-game:
    def: Repeated game in which each stage is an extensive-form game with sequential moves within a period; collusive equilibria require multi-phase punishment strategies beyond simple penal codes because move order within a period matters.
    aliases: [repeated-extensive-form, repeated-multistage-game]
  mechanism-design:
    def: Design of rules and incentive structures (mechanisms) to achieve a desired outcome; includes auction design, contract design, and information-design problems where the designer moves first.
    aliases: [optimal-mechanism-design, mechanism-design-theory]

  # ---- security-bid auction models ----
  security-bid-auction:
    def: Auction in which bidders compete by submitting bids in general securities (cash, equity, debt, call options); the winner's payment structure is endogenously determined by the security she chooses.
    aliases: [security-auction, general-security-auction]

  # ---- AMM equilibrium models ----
  amm-equilibrium-pool-size:
    def: Structural equilibrium model in which liquidity-pool token supply is determined by equating fee revenue to the adverse-selection cost imposed by an informed arbitrageur who trades whenever the bonding-curve price diverges from the fundamental value.
    aliases: [bonding-curve-equilibrium, constant-product-amm-equilibrium]

  # ---- market design and auction models ----
  brokers-routing-vs-obo-auction-model:
    def: Common-value auction framework with linear symmetric equilibrium comparing brokers' routing of retail orders to order-by-order auctions; shows the winner's curse reduces investor welfare in illiquid stocks when bidder counts are small.
    aliases: [obo-auction-model, retail-order-routing-model]

  # ---- axiomatic preference representations ----
  simplicity-representation:
    def: Axiomatic preference representation in which an agent prefers lottery p over q iff the expected utility of p minus a complexity cost C(#p) exceeds the expected utility of q minus C(#q), where C is weakly increasing in the number of outcomes.
    aliases: [complexity-aversion-representation, simplicity-preference-model]

  # ---- survey / randomized-information experiments ----
  randomized-survey-experiment:
    def: Preregistered online or field survey experiment that introduces exogenous variation in a stated variable across randomly assigned treatment arms to identify causal effects on stated or revealed choices.
    aliases: [information-experiment, survey-rct]

  # ---- panel standard-error estimators ----
  driscoll-kraay-regression:
    def: Panel regression with Driscoll-Kraay standard errors allowing arbitrary serial correlation and cross-sectional dependence up to K lags; used for international macro panel data with few cross-sectional clusters.
    aliases: [dk-se-regression, driscoll-kraay-se]

  # ---- discrete-choice panel estimators ----
  conditional-logit:
    def: Conditional fixed-effects logit for binary outcomes in matched or grouped data; within-group (fixed-effect) estimator that eliminates group-level unobservables; distinct from cross-sectional logit-regression.
    aliases: [conditional-logit-regression, clogit, fixed-effects-logit]

  # ---- nonexclusive-contracting models ----
  nonexclusive-contracting-model:
    def: Contracting model in which a borrower can sign with multiple creditors simultaneously and cannot be legally prevented from doing so; covenants can be violated by new secured debt that retains priority regardless.
    aliases: [nonexclusive-debt-model, nonexclusivity-model]

  # ---- private credit risk-adjustment ----
  rap-bank-loans:
    def: Risk-adjusted profit methodology adapted from private equity strip-by-strip valuation to price bank loan cash flows; uses loan-balance-instrumented benchmark funds spanning credit, term, prepayment, and equity risk factors.
    aliases: [loan-rap, bank-loan-rap]

  # ---- New Keynesian banking models ----
  new-keynesian-banking-model:
    def: New Keynesian general equilibrium model with imperfectly competitive banks, net-worth-constrained lending, and long-term bond holdings creating maturity mismatch.
    aliases: [nk-banking-model, klein-monti-nk]

  # ---- analytical HANK frameworks ----
  cara-normal-hank:
    def: Analytical HANK model with CARA preferences and normally distributed idiosyncratic income shocks, enabling linear aggregation of household decisions independent of the wealth distribution.
    aliases: [analytical-hank, cara-hank]

  # ---- ranked-choice estimation ----
  rank-ordered-logit:
    def: Discrete-choice model for ranked preference lists; each successive choice modeled as a logit over the remaining alternatives (exploded logit); estimated by maximum likelihood on full or partial rankings.
    aliases: [exploded-logit, rank-ordered-choice-model]

  # ---- routing-engine speed index measurement ----
  city-speed-index:
    def: City-level vehicular speed index constructed from simulated routing-engine trips, decomposable into uncongested speed and congestion factor via fixed-effects regression on log trip speed and no-traffic duration.
    aliases: [gm-speed-index, routing-engine-speed-index]

  # ---- AKM variance decomposition ----
  akm-variance-decomposition:
    def: Two-way fixed-effects decomposition attributing outcome variance to individual and organizational components, as in Abowd-Kramarz-Margolis (1999); bias-corrected via split-sample and covariance-shrinkage estimators to address limited-mobility bias in sparse networks.
    aliases: [akm-method, two-way-fe-decomposition, worker-firm-variance-decomposition]

  # ---- bunching and excess-mass ----
  loan-loss-underreporting-detector:
    def: Markovian excess-mass algorithm that measures strategic delay in loss reporting by computing deviations from the expected progression of overdue loan balances across regulatory deduction-rate buckets at the monthly firm-bank level.
    aliases: [excess-mass-underreporting, bunching-underreporting-measure]

  # ---- local projections ----
  local-projections:
    def: Sequence of direct horizon-specific regressions (Jorda 2005) that project an outcome h periods ahead on a contemporaneous shock, tracing the full impulse-response function without imposing a dynamic-model parameterization.
    aliases: [jorda-local-projections, lp-regression, lp-irfs]

  # ---- dynamic contracting ----
  abiding-contracts:
    def: Simple and direct dynamic contracts that guarantee nonnegative buyer continuation payoff and seller continuation payoff exceeding the low buyer valuation; the key device for breaking the Coase conjecture under limited commitment.
    aliases: [delta-abiding-contracts]

  # ---- signaling equilibrium ----
  signaling-game-pbe:
    def: Perfect Bayesian Equilibrium signaling game with privately-informed sender types; equilibria refined by the Cho-Kreps intuitive criterion to eliminate implausible off-equilibrium beliefs.
    aliases: [pbe-signaling, separating-pooling-equilibrium, cho-kreps-signaling]

  # ---- occupational choice models ----
  roy-occupational-sorting:
    def: Occupational sorting model where heterogeneous workers draw occupation-specific efficiency units from a Frechet distribution and choose the highest-paying occupation; yields closed-form market-clearing conditions for occupational labor supply as a function of wages per efficiency unit.
    aliases: [frechet-occupational-choice, roy-sorting-frechet]

  # ---- Bayesian DSGE estimation ----
  bayesian-dsge-estimation:
    def: Bayesian estimation of a linearized DSGE model; exogenous driving-process time series are fed directly as observables without measurement error; measurement errors apply only to outcome variables; follows the Smets-Wouters (2007) approach.
    aliases: [bayesian-dsge, dsge-bayesian-estimation, smets-wouters-estimation]

  # ---- demand profile supply contracting ----
  demand-profile-supply-contracting:
    def: Goldman-Leland-Sibley/Wilson demand profile approach adapted to supply contracting; reformulates the principal's problem by treatment quantity so that a multidimensional type distribution projects onto a one-dimensional quantity distribution and each marginal payment is set independently.
    aliases: [demand-profile-approach, wilson-demand-profile, goldman-leland-sibley]

  # ---- Yaari dual utility ----
  yaari-dual-utility:
    def: Preference model in which certainty equivalents are computed by distorting probabilities via an increasing function g with g(p) <= p rather than taking expectations; nests loss aversion and rank-dependent utility.
    aliases: [dual-utility, rank-dependent-utility-insurance, probability-weighting-utility]

  # ---- speech emotion recognition ----
  speech-emotion-recognition:
    def: Deep neural network trained on labeled speech emotion datasets that maps audio feature vectors (mel spectrogram, MFCCs, chroma coefficients) to discrete emotion categories.
    aliases: [audio-emotion-classification, speech-emotion-nn]

  # ---- incomplete-markets heterogeneous-agent models ----
  heterogeneous-agent-bewley-model:
    def: Infinite-horizon incomplete-markets model with a continuum of households facing idiosyncratic income risk and a borrowing constraint; households optimize consumption-saving plans in a small-open-economy or partial-equilibrium setting.
    aliases: [bewley-model, aiyagari-model, bewley-hugget-aiyagari, incomplete-markets-ha-model]

  # ---- mean-variance optimization under CARA ----
  cara-mean-variance-optimization:
    def: Reduction of CARA expected-utility maximization under normally distributed payoffs to an equivalent mean-variance program, yielding closed-form portfolio demands and tractable general equilibrium characterization.
    aliases: [cara-mv, cara-normal-mv]

  # ---- norm identification ----
  legal-threshold-norm-identification:
    def: Identification strategy that exploits laws with threshold-based rules as RDD-analog cutoffs; continuity of the norm function absent the law allows discontinuities at the threshold to be attributed causally to the law.
    aliases: [threshold-norm-identification, legal-threshold-rdd]

  # ---- trade policy structural methods ----
  optimal-trade-dual:
    def: Dual approach to characterizing unilaterally optimal trade and industrial policies in multi-industry multi-country GE models; derives analytical sufficient statistics formulas via envelope conditions, tax neutrality, and homogeneity of Marshallian demand, without numerical optimization.
    aliases: [sufficient-statistics-trade-policy, trade-policy-dual-approach]

  # ---- matrix decomposition ----
  nonneg-matrix-factorization:
    def: Non-negative matrix factorization algorithm that decomposes a non-negative matrix into two non-negative factor matrices; adapted here with a Poisson deviance criterion to jointly estimate latent technology weights and expenditure shares in structural trade models.
    aliases: [nmf, nonnegative-matrix-factorization, nmf-ppml]

  # ---- political economy frameworks ----
  grossman-helpman-political-economy:
    def: Grossman-Helpman (1994) protection-for-sale framework in which lobby groups represent specific-factor owners and government maximizes a weighted sum of welfare and producer surplus with extra weight on sector-specific producer surplus from lobbying.
    aliases: [protection-for-sale, gh-political-economy, gh-pe]

mechanisms: # the economic channel(s)/friction(s) a paper invokes (paper.mechanisms)
  information-asymmetry:
    def: One party holds payoff-relevant private information the other lacks; includes adverse selection, signaling, and private-information trading.
    aliases: [adverse-selection, asymmetric-information, private-information, signaling]
  moral-hazard:
    def: "Hidden action: an agent's unobserved effort or risk-taking responds to incentives, distinct from hidden-type adverse selection."
    aliases: [hidden-action, risk-shifting]
  agency:
    def: Conflicts of interest between a principal and an agent (manager vs shareholder, owner vs creditor) that distort decisions away from first best.
    aliases: [agency-conflict, principal-agent-friction, managerial-agency]
  limits-to-arbitrage:
    def: Frictions (capital constraints, noise-trader risk, slow-moving capital) that prevent arbitrageurs from correcting mispricing.
    aliases: [slow-moving-capital, arbitrage-constraint, mispricing-persistence]
  intermediary-constraint:
    def: Financial intermediaries' balance-sheet, capital, or leverage constraints bind and affect asset prices and credit supply.
    aliases: [balance-sheet-constraint, dealer-constraint, intermediary-capital]
  collateral:
    def: Borrowing is limited by the pledgeable value of collateral; collateral values and haircuts drive credit and amplification.
    aliases: [collateral-constraint, pledgeability, margin-constraint]
  financial-constraint:
    def: Firms or households face a wedge between internal and external finance that limits investment or consumption.
    aliases: [financing-constraint, external-finance-premium, credit-constraint]
  liquidity:
    def: Market liquidity (price impact, bid-ask cost) or funding liquidity (access to short-term financing) affects prices, trading, or real outcomes.
    aliases: [market-liquidity, funding-liquidity, price-impact, illiquidity]
  search-frictions:
    def: Trade requires costly bilateral search and bargaining, as in over-the-counter markets, generating dispersion and intermediation rents.
    aliases: [search-and-matching, otc-search, bargaining-friction]
  risk-sharing:
    def: Incomplete markets limit the pooling of idiosyncratic or aggregate risk, affecting consumption smoothing and risk premia.
    aliases: [incomplete-risk-sharing, consumption-insurance, incomplete-markets-channel]
  behavioral-bias:
    def: Systematic departures from rational expectations or utility (overextrapolation, inattention, prospect-theory preferences) drive choices and prices.
    aliases: [belief-distortion, extrapolation, inattention, prospect-theory]
  learning:
    def: Agents update beliefs from data (Bayesian or adaptive); incomplete information about parameters or states drives dynamics.
    aliases: [bayesian-learning, belief-updating, parameter-uncertainty]
  demand-elasticity:
    def: Inelastic or downward-sloping demand for assets means flows and supply shifts move prices, as in demand-based asset pricing.
    aliases: [inelastic-demand, demand-based-asset-pricing, price-inelasticity]
  market-power:
    def: Imperfect competition lets firms or intermediaries set prices above marginal cost, affecting markups, spreads, or quantities.
    aliases: [competition, imperfect-competition, market-concentration]
  networks:
    def: Interconnections among firms, banks, or markets propagate and amplify shocks (contagion, spillovers, common exposures).
    aliases: [contagion, interconnectedness, spillovers, financial-networks]
  taxes:
    def: Tax incentives or distortions shape financing, payout, portfolio, or real decisions.
    aliases: [tax-incentive, tax-distortion, taxation-channel]
  occupational-stress:
    def: Job demands or work-related stressors impose direct physiological or psychological costs on workers, manifesting as health deterioration, accelerated aging, or mortality.
    aliases: [job-demands, work-stress, managerial-stress]
  esg-reputation:
    def: Reputational damage from ESG incidents causes customers or stakeholders to reduce purchases or engagement, transmitting ESG shocks into lower future sales and cash flows.
    aliases: [customer-demand-channel, reputational-damage, esg-cash-flow-channel]
  political-capture:
    def: Incumbent firms use political connections to lobby for regulatory barriers to entry and capital flows, entrenching their market positions against competitive replacement.
    aliases: [regulatory-capture, political-connections-entrenchment]
  disaster-risk-premium:
    def: Cross-sectional hedging channel in which assets that co-vary positively with rare-disaster risk earn lower expected returns because they are good hedges for aggregate consumption disasters.
    aliases: [rare-disaster-hedging, disaster-hedging-channel]
  organizational-complexity:
    def: Increased operational complexity (task variety, information load, regulatory demands) drives firms to restructure hierarchies, add layers, and specialize roles.
    aliases: [task-complexity, information-processing-hierarchy]
  participation-frictions:
    def: One-time fixed costs of entering or adjusting a market position, distinct from per-period costs; generates inertia and a wedge between observed and preferred choices.
    aliases: [adjustment-costs, fixed-participation-cost, portfolio-adjustment-cost]
  credit-inflation-channel:
    def: Sovereign default risk differentially prices nominal versus real bonds via the correlation between default probability and inflation dynamics (deflation pre-default, inflation upon default).
    aliases: [sovereign-default-inflation-channel, inflation-upon-default, default-inflation-correlation, credit-inflation-correlation]
  externality:
    def: Unpriced or under-priced negative externality (pollution, carbon emissions) distorts firm decisions; corrective taxes or cost-of-capital adjustments restore the social optimum.
    aliases: [pollution-externality, carbon-externality, negative-externality]
  flight-to-safety:
    def: Investors reallocate toward safe-haven assets when perceived macroeconomic risk or risk aversion rises, driving safe-asset appreciation independent of interest rate differentials.
    aliases: [safe-haven-demand, risk-off, safety-channel]
  debt-overhang:
    def: Outstanding debt distorts a borrower's or firm's effort and investment decisions because a fraction of future income or returns accrues to creditors rather than the agent.
    aliases: [debt-burden-distortion, student-debt-overhang]
  self-partner-control:
    def: Intrahousehold or dual-self mechanism in which one party hides or locks away cash from an impatient party to constrain future spending; generates coholding without requiring saving and borrowing to move in tandem.
    aliases: [partner-control, dual-self-control, intrahousehold-control]
  disparate-treatment:
    def: Lenders or decision-makers treat applicants with identical observed risk characteristics differently on the basis of a protected attribute (race, ethnicity); encompasses both taste-based and statistical discrimination.
    aliases: [racial-discrimination, differential-treatment, fair-lending-violation]
  excess-capacity-wedge:
    def: Anticipated future excess capacity drives a wedge between average and marginal q, reducing the marginal benefit of new capital investment; firms with high expected excess capacity invest less than average q alone predicts.
    aliases: [capacity-utilization-wedge, marginal-average-q-wedge, excess-capacity]
  sunk-cost-commitment:
    def: Behavioral friction in which decision-makers weigh irrecoverable past costs in subsequent investment choices, generating over-commitment to costly projects beyond the NPV-optimal stopping rule.
    aliases: [escalation-of-commitment, sunk-cost-fallacy, concorde-effect]
  network-exclusion:
    def: Mechanism in which incumbent agents refuse to work with a price deviator within the current period, cutting the deviator off from the incumbent network and making price cuts unprofitable even when many competitors exist.
    aliases: [ostracism-mechanism, network-ostracism]
  switching-costs:
    def: One-time monetary and nonmonetary costs a borrower incurs when changing lenders, creating a lock-in advantage for the incumbent and reducing competitive pressure at renewal.
    aliases: [lock-in, incumbent-advantage, switching-friction]
  fire-sale-externality:
    def: Forced asset liquidations depress the fire-sale price received by other banks, creating a negative pecuniary externality that reduces recovery values and loanable funds across the system.
    aliases: [fire-sale, liquidation-fire-sale, asset-fire-sale]
  greenwashing-divestiture:
    def: Firms divest pollutive assets to improve ESG ratings without reducing actual pollution levels, exploiting information frictions and scope-3 accounting gaps.
    aliases: [cosmetic-divestiture, boundary-redrawing-esg]
  contagious-turnover:
    def: Strategic complementarity in workers' departure decisions where one worker's exit raises the probability that others follow, because it reduces firm productivity and thus the value of remaining workers' output-dependent pay.
    aliases: [worker-run, collective-turnover-friction]
  regulatory-inconsistency:
    def: Conflicting requirements across agencies overseeing the same regulatory topic, raising firm compliance costs beyond mere redundancy.
    aliases: [inter-agency-inconsistency]
  prosocial-commitment:
    def: Personal interaction transforms an impersonal financial obligation into a commitment toward an individual, activating prosocial behavior and reducing moral hazard.
    aliases: [promise-keeping, social-commitment, personal-touch]
  labor-supply-channel:
    def: Households respond to tightened budget constraints by increasing labor supply rather than only cutting consumption, generating a positive income response to interest rate increases.
    aliases: [labor-income-channel, marginal-propensity-to-earn]
  belief-endogeneity:
    def: Mechanism in which agent beliefs about uncertain fundamentals are determined endogenously by hierarchical position and incentive contracts received, rather than being exogenous; creates disagreement and an uncertainty discount distinct from risk aversion.
    aliases: [endogenous-beliefs, contractual-belief-formation]
  cost-of-capital:
    def: Opportunity cost of capital deployed in validation, mining, or investment determines security or participation levels; the channel through which capital efficiency differences across protocols or instruments affect equilibrium outcomes.
    aliases: [capital-opportunity-cost, validation-cost-channel]
  option-to-wait-deterrence:
    def: Uncertainty raises the option value of waiting for irreversible investments; when policy or subsidy payoffs become more uncertain, the waiting premium rises and investment falls.
    aliases: [irreversibility-channel, wait-and-see, investment-under-uncertainty]
  demand-disagreement:
    def: Disagreement about the future mix of investor types drives speculative savings demand, generating time-varying bond risk premia and yield volatility independent of macroeconomic fundamentals.
    aliases: [demand-uncertainty, savings-demand-disagreement]
  supply-chain-rigidity:
    def: Rigidity in customer or supplier relations prevents affected firms from quickly substituting alternative partners, amplifying the collateral costs of trade policy shocks.
    aliases: [supply-chain-friction, customer-substitution-rigidity]
  social-coordination:
    def: Social media publicly aggregates and broadcasts concerns, enabling rapid coordination on withdrawal decisions and amplifying run risks by lowering the threshold for a coordinated run.
    aliases: [depositor-coordination, social-media-coordination]
  team-self-selection:
    def: The less-biased team member disproportionately takes decision authority in group choices, attenuating the transmission of individual behavioral biases into collective outcomes.
    aliases: [belief-aggregation-self-selection, team-leadership-selection]
  uniform-pricing-conduct:
    def: Multi-branch firms set a single network-wide price rather than optimizing locally, decoupling local market concentration from pricing outcomes and creating network-wide spillovers from any ownership change.
    aliases: [network-wide-pricing, uniform-price-setting]
  multidimensional-preferences:
    def: Households trade off a target quality dimension against other product attributes, leaving the target quality underweighted even under full information.
    aliases: [preference-multidimensionality, non-academic-preference-constraint]
  rent-seeking-price-externality:
    def: Pecuniary externality where shareholders collectively distort investment to exploit price biases, reducing aggregate dividends and feeding back to amplify underinvestment and dampen overinvestment.
    aliases: [share-price-ge-externality, aggregate-dividend-externality]
  coordination-failure:
    def: Inability of independent agents to commit to joint provision of public goods requiring multi-party cooperation, generating demand for a coordinating institution.
    aliases: [public-goods-coordination, collective-action-failure]
  social-norm-erosion:
    def: Public revelation of latent agreement with stigmatized views unravels social norms constraining discriminatory behavior, facilitating coordination among like-minded individuals.
    aliases: [social-norm-unraveling, norm-erosion, norm-unraveling]
  coordination-commitment:
    def: Incremental public commitment in a pre-play revision phase makes prepared actions partially binding, enabling backward-induction selection of the Pareto-dominant equilibrium in coordination games.
    aliases: [revision-commitment, pre-play-incremental-commitment]
  fed-response-to-news:
    def: The Fed and private forecasters respond to the same public economic news, with the Fed reacting more strongly than markets anticipated, creating spurious procyclical correlation between FOMC surprises and forecast revisions.
    aliases: [fed-news-response, central-bank-news-response]
  skill-obsolescence:
    def: Technological change raises occupation-specific skill requirements, making incumbent workers' human capital obsolete and forcing occupation switches to lower-paying roles where prior skills remain employable.
    aliases: [skill-mismatch-tech, human-capital-obsolescence, technology-skill-frontier]
  workplace-social-capital:
    def: Face-to-face social interactions between employees and managers build relational capital that translates into promotion advantages via preference and information channels.
    aliases: [manager-employee-socialization, schmoozing, relational-capital]
  media-framing:
    def: Language choices by media outlets shift readers' policy attitudes by emphasizing or omitting issue attributes (emphasis framing) or by substituting differently coded labels for the same referent (equivalence framing).
    aliases: [emphasis-framing, equivalence-framing, media-persuasion, framing-effect]
  dollar-pricing-wedge:
    def: Dollar currency pricing prevents monetary policy from closing the external export wedge; each economy's exports are a zero-measure share of global demand, making the external wedge constrained efficient and domestic inflation targeting the only achievable goal for non-US central banks.
    aliases: [dcp-external-wedge, invoice-currency-wedge]
  personalization-of-instruction:
    def: Mechanism in which small-group or individualized instruction allows the instructor to target teaching to each student's achievement level, generating larger learning gains than whole-class instruction where the teacher must address the median student.
    aliases: [individualized-instruction, differentiated-instruction]
  contracting-pecuniary-externality:
    def: Incentive contracts for delegated managers raise aggregate demand for benchmark assets, inflate equilibrium prices, and reduce the marginal benefit of benchmarking contracts for other investors; the externality is transmitted through the equilibrium asset price.
    aliases: [contracting-externality, contract-price-externality]
  love-for-variety-externality:
    def: Scale economies that arise from consumer love for variety create a positive externality from firm entry not internalized by individual firms; equilibrium scale in high-scale-elasticity industries is inefficiently low, generating cross-industry misallocation correctable by Pigouvian subsidies.
    aliases: [scale-economy-externality, variety-externality]
  comparative-advantage-correlation:
    def: Dissimilarity in productivity across trading partners (low correlation) strengthens comparative advantage and raises gains from trade; higher cross-country productivity correlation weakens comparative advantage and reduces trade gains.
    aliases: [ricardian-correlation-channel, technology-dissimilarity-mechanism]
  lobbying-coordination:
    def: International regulatory negotiations alter the effective influence of domestic producer lobbies; when producer interests align across countries (product standards), negotiations amplify lobby influence via co-lobbying; when interests conflict (process standards), negotiations attenuate it via counter-lobbying.
    aliases: [co-lobbying, counter-lobbying, lobby-amplification, lobby-dilution]

metrics: # findings[].metric: the statistic a headline result reports, as a kebab slug.
  # Governs the per-finding `metric` axis (paper.findings[].metric). A distiller
  # reuses a slug (or alias) before coining; meta.mjs flags any metric not found
  # here as non-canonical so fragmentation stays visible.
  coefficient:
    def: Regression slope on the regressor of interest; sign and significance as reported. The catch-all when the headline number is a panel/cross-sectional coefficient.
  pp-effect:
    def: Effect expressed in percentage points of the outcome (a level change, not a coefficient on a continuous regressor).
    aliases: [percentage-point-effect, ppt-effect]
  basis-points:
    def: Effect, spread, or rate difference expressed in basis points.
    aliases: [bps, basis-point-effect]
  alpha:
    def: Risk-adjusted abnormal return (intercept) against a factor model.
    aliases: [abnormal-return, jensen-alpha]
  return-spread:
    def: Long-short, high-minus-low, or between-group spread of a return, premium, yield, or price, from a portfolio sort or two-group comparison. Use a unit metric (basis-points, pp-effect) instead when the spread is reported purely in those units, and coefficient / sd-effect for a spread of a non-price quantity (a share, score, or characteristic).
    aliases: [long-short-return, hml-spread]
  car:
    def: Cumulative abnormal return over an event window.
    aliases: [cumulative-abnormal-return]
  sharpe-ratio:
    def: Ratio of mean excess return to its standard deviation.
    aliases: [sr]
  beta:
    def: Factor loading / regression beta on a risk factor.
    aliases: [factor-loading]
  r-squared:
    def: In-sample fraction of variance explained.
    aliases: [r2]
  oos-r-squared:
    def: Out-of-sample R-squared against a benchmark forecast (Campbell-Thompson / Clark-West).
    aliases: [oos-r2, out-of-sample-r-squared]
  correlation:
    def: Pairwise correlation or comovement coefficient.
    aliases: [comovement]
  elasticity:
    def: Percent response of the outcome to a percent change in the driver.
  sd-effect:
    def: Effect expressed in standard deviations of the outcome (a standardized effect size, or effect per 1-SD change in the driver).
    aliases: [standardized-effect]
  t-stat:
    def: Reported t-statistic standing in for the magnitude; use only when no point estimate is the headline number.
    aliases: [t-statistic]
  hazard-ratio:
    def: Ratio of hazard rates in a survival / duration model. Distinct from a logistic odds ratio; do not conflate.
  probability:
    def: A probability, rate, proportion, or share of a binary or count outcome (a level in [0,1] or a percent), including survival / mortality rates.
    aliases: [proportion, share, rate, survival-milestone, frequency]
  level:
    def: A level or volume in natural units (a currency amount, a count, a dollar volume), where the headline number is the magnitude itself rather than an effect or ratio.
    aliases: [volume, inflow-volume, dollar-amount]
  fiscal-multiplier:
    def: PDV ratio of aggregate output response to a fiscal policy shock; reported as dollars of output per dollar of outlay.
    aliases: [pdv-multiplier, impact-multiplier, spending-multiplier]
  covariance:
    def: Sample covariance between two variables across cross-sectional units; measures the direction and scale of their joint variation, not normalized to the [-1, 1] interval.
    aliases: [sample-covariance, cross-sectional-covariance]

outcome-classes: # paper.outcomeClass[]: coarse governed bucket(s) for the dependent
  # variable(s), layered over the free-text `outcome[]` the way `jel` layers over
  # `topics`. `outcome[]` keeps the precise phrasing (provenance); outcomeClass is
  # the controlled axis that makes "what is being explained" queryable across the
  # corpus. Assign 1-3 from the abstract / Core-results table. meta.mjs flags any
  # value not listed here.
  security-returns:
    def: Realized or expected returns on securities - cross-sectional or aggregate stock/bond/currency returns, alphas, Sharpe ratios, factor and anomaly premia, abnormal/event returns (CAR), and return predictability.
  asset-prices:
    def: Price levels, yields, spreads, valuation ratios, and exchange-rate levels (the price or spread itself, not its return) - credit spreads, arbitrage spreads, bond yields, price-dividend ratios, MBS prices.
  firm-real-outcomes:
    def: Real firm outcomes - investment and capital expenditure, hiring and employment, earnings and sales, organizational structure, and the firm's labor share.
  firm-financing:
    def: Firm capital structure and the cost or terms of finance from the issuer/borrower side - debt levels, leverage, cost of capital, payout, and the loan rates and markups a borrower pays.
  credit-supply:
    def: Lender-side credit provision - bank lending volumes, loan approval and amount, monitoring intensity, and aggregate credit growth.
  credit-risk:
    def: Realized or expected credit deterioration - default and delinquency probabilities, covenant violations, supervisory ratings, and banking-crisis probability.
  bank-funding:
    def: Intermediary funding and liquidity - deposit flows and composition, reserves, payment-system flows, and money-fund portfolio weights.
  household-finance:
    def: Household balance-sheet outcomes - stock-market participation, household portfolio shares and trading, mortgage rates paid and overpayment, and household debt, income, and mobility.
  fund-behavior:
    def: Institutional and fund behavior and performance - fund flows, trading, returns and value-add, ESG loadings, and institutional portfolio tilts.
  expectations:
    def: Beliefs, forecasts, and survey expectations - analyst forecast revisions and survey-based return or inflation expectations.
  macro-aggregates:
    def: Economy-wide aggregates and prices of aggregate risk - aggregate consumption, output and investment, the equity premium, the riskless rate, and the term premium.
  firm-dynamics:
    def: Firm survival and market structure - persistence among the largest firms, entry and exit, mergers and withdrawals, and concentration.
  labor-careers-health:
    def: Outcomes for executives and workers - health, aging and mortality, careers, promotions and discrimination, skill investment, and the design of compensation and incentives.
  market-microstructure:
    def: Prices, spreads, and welfare outcomes in trading mechanism design - bid-ask spreads, allocative efficiency, trader surplus, and market share across venues.
    aliases: [trading-mechanism-outcomes, market-design-welfare]
  social-welfare:
    def: Welfare and social-impact outcomes - corporate social impact, welfare losses, ESG / carbon impact measures, and outcomes of social protection programs such as poverty rates and benefit receipt.
    aliases: [social-protection-outcomes, welfare-program-outcomes, safety-net-outcomes]
  educational-choices:
    def: School enrollment, track selection, and educational attainment outcomes from household school-choice decisions; includes value added and academic performance of the chosen program.
    aliases: [school-choice-outcomes, education-attainment]
  urban-mobility:
    def: City-level travel speed, congestion, and transportation accessibility outcomes - speed indices, congestion factors, trip-time reliability, and welfare cost of slow travel.
    aliases: [city-mobility, urban-transport-outcomes]
  political-development:
    def: State formation, governance capacity, and institutional development outcomes, including emergence of states, public good provision by governments, tribute collection, and measures of administrative capacity.
    aliases: [state-formation, governance-outcomes, institutional-development]
  trade-flows:
    def: Bilateral trade values or quantities and their sensitivity to trade costs or tariffs; includes trade elasticity measurement and gains-from-trade quantification.
    aliases: [bilateral-trade, trade-volumes, trade-elasticity-outcome]
  social-preferences:
    def: Revealed distributional preferences and fairness norms, including type classification (false negative averse, false positive averse, symmetric) and related policy attitude formation.
    aliases: [distributional-preferences, fairness-type-classification]
  optimal-contract-design:
    def: Structure of profit-maximizing or welfare-maximizing contracts and price schedules, including nonlinear pricing, multi-part tariffs, insurance menus, and screening contract forms.
    aliases: [optimal-pricing, tariff-structure, screening-contract, insurance-contract-design, optimal-insurance-mechanism, contract-form-optimality]
  behavioral-aggregate-outcomes:
    def: Quality of collective decision-making and the degree to which social institutions filter or amplify individual cognitive biases, measured as aggregate performance relative to raw individual bias rates.
    aliases: [collective-cognition-outcomes, institutional-filtering-outcomes]
  educational-achievement:
    def: Academic skill, knowledge, and attainment outcomes from educational interventions - standardized test scores, subject grades, course completions, high school graduation rates, and human capital formation.
    aliases: [academic-outcomes, academic-performance]
  social-norms:
    def: Perceived social appropriateness of behaviors and norm functions; outcomes that measure how laws and institutions shape what is collectively approved or disapproved in a society.
    aliases: [norm-function-outcomes, social-appropriateness-outcomes]
